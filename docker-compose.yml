services:
  postgres:
    image: postgres:16-alpine
    container_name: revivepay-db
    environment:
      POSTGRES_USER: revivepay
      POSTGRES_PASSWORD: revivepay_dev
      POSTGRES_DB: revivepay
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revivepay"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
