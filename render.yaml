services:
  # -------------------------------------------------------------
  # RevivePay FastAPI Backend
  # -------------------------------------------------------------
  - type: web
    name: revivepay-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_MODE
        value: developer
      - key: AI_PROVIDER
        value: gemini
      - key: DATABASE_URL
        fromDatabase:
          name: revivepay-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: revivepay-frontend
          property: host
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # RevivePay Next.js Frontend
  # -------------------------------------------------------------
  - type: web
    name: revivepay-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Set manually to https://<backend-url>.onrender.com

databases:
  # -------------------------------------------------------------
  # RevivePay PostgreSQL Database
  # -------------------------------------------------------------
  - name: revivepay-db
    databaseName: revivepay
    user: revivepay
    plan: free
